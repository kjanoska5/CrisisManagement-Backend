name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Ustawienie JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Nadanie uprawnień do wykonania gradlew
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest

      - name: Build (debug)
        run: ./gradlew assembleDebug
